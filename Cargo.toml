[package]
name = "noctune"
version = "0.4.1"
edition = "2021"
authors = ["wendellocf <wendellocf@gmail.com>"]
description = "A fully customizable terminal music player with ASCII art TUI"
license = "MIT"
repository = "https://github.com/WendellOttoni/Noctune"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Audio
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }

# Config & themes
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utils
anyhow = "1"
thiserror = "2"
directories = "5"
walkdir = "2"
notify = "6"
unicode-width = "0.2"
rustfft = "6"
parking_lot = "0.12"
# #88: parallel library scan. Used in app.rs::scan_library.
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }
tiny_http = "0.12"
webbrowser = "1"
discord-rich-presence = "1"

# OS media-session integration (#54). souvlaki abstracts SMTC / MPRIS / MediaRemote.
souvlaki = "0.7"

# Structured logging (#96). Default sink is a rotating file under the user's
# data directory; --debug elevates to DEBUG, --log-stderr redirects to stderr.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Token storage (#98). Wraps Secret Service / Keychain / Credential Manager
# with a file fallback for headless systems.
keyring = "3"

# souvlaki on Windows needs a real HWND. We create a hidden HWND_MESSAGE window
# ourselves via the `windows` crate and pass the handle into PlatformConfig.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
